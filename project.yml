name: Fixify
options:
  bundleIdPrefix: app.fixify
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Fixify:
    type: application
    platform: iOS
    sources:
      - path: Fixify
      - path: Shared
    dependencies:
      - target: FixifyControls
      - target: FixifyBroadcast
    entitlements:
      path: Fixify/Fixify.entitlements
      properties:
        com.apple.security.application-groups: [group.app.fixify.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fixify.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fixify
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Fixify uses the camera to photograph the problem you want help with."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Fixify lets you pick photos or screenshots of a problem."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Fixify connects to your own analysis server on this network."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "FixVoice uses the microphone so you can talk to Fixify like on the phone."
        CODE_SIGN_STYLE: Automatic
    info:
      path: Fixify/Info.plist
      properties:
        CFBundleLocalizations: [en, de]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts: [Montserrat-Light.ttf, Montserrat-Regular.ttf, Montserrat-Medium.ttf, Montserrat-SemiBold.ttf, Montserrat-Bold.ttf]
        # Lets a screen question finish reading its answer aloud after the card appears.
        UIBackgroundModes: [audio]
  FixifyControls:
    type: app-extension
    platform: iOS
    sources:
      - path: FixifyControls
      - path: Shared
      - path: Fixify/Resources/Localizable.xcstrings
      - path: Fixify/Resources/Fonts
    entitlements:
      path: FixifyControls/FixifyControls.entitlements
      properties:
        com.apple.security.application-groups: [group.app.fixify.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fixify.ios.controls
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fixify
        CODE_SIGN_STYLE: Automatic
    info:
      path: FixifyControls/Info.plist
      properties:
        CFBundleLocalizations: [en, de]
        UIAppFonts: [Montserrat-Regular.ttf, Montserrat-Medium.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FixifyBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: FixifyBroadcast
      - path: Shared/Core
      - path: Fixify/Resources/Localizable.xcstrings
    entitlements:
      path: FixifyBroadcast/FixifyBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.app.fixify.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fixify.ios.broadcast
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fixify
        CODE_SIGN_STYLE: Automatic
    info:
      path: FixifyBroadcast/Info.plist
      properties:
        CFBundleLocalizations: [en, de]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
  FixifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FixifyTests
    dependencies:
      - target: Fixify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fixify.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Fixify:
    build:
      targets:
        Fixify: all
        FixifyTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Fixify/Resources/Fixify.storekit
    test:
      config: Debug
      targets:
        - FixifyTests
